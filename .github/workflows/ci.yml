name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # One package at a time: the Shiki-based Markdown test is slow to warm up under parallel load.
      - run: pnpm -r --workspace-concurrency=1 --if-present test
      - run: pnpm --filter @blog/admin build
      # Layout of the built admin at phone/tablet/desktop widths (fake API, no AWS).
      - run: pnpm --filter @blog/admin exec playwright install --with-deps chromium
      - run: pnpm --filter @blog/admin test:layout
      - name: cdk synth (no AWS credentials needed)
        working-directory: infra
        run: pnpm exec cdk synth --all -q
